groups:
  - name: metrics-aggregator
    rules:
      - alert: MetricsAggregatorAllEndpointsDown
        expr: sum(metrics_aggregator_scrape_success) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "All scrape endpoints are down"
          description: "No configured endpoint has returned metrics for over 2 minutes."
          runbook: "See runbook.md#MetricsAggregatorAllEndpointsDown"

      - alert: MetricsAggregatorEndpointDown
        expr: metrics_aggregator_scrape_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scrape endpoint {{ $labels.endpoint }} is down"
          description: "Endpoint {{ $labels.endpoint }} has not returned metrics for 5 minutes."
          runbook: "See runbook.md#MetricsAggregatorEndpointDown"

      - alert: MetricsAggregatorHighErrorRate
        expr: rate(metrics_aggregator_scrape_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High scrape error rate for endpoint {{ $labels.endpoint }}"
          description: "Endpoint {{ $labels.endpoint }} error rate exceeds 0.1/s for 5 minutes."
          runbook: "See runbook.md#MetricsAggregatorHighErrorRate"

      - alert: MetricsAggregatorSlowScrape
        expr: histogram_quantile(0.99, rate(metrics_aggregator_scrape_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow scrape for endpoint {{ $labels.endpoint }}"
          description: "P99 scrape duration for {{ $labels.endpoint }} exceeds 5s."
          runbook: "See runbook.md#MetricsAggregatorSlowScrape"

      - alert: MetricsAggregatorHighInvalidSamples
        expr: metrics_aggregator_scrape_invalid_samples > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High invalid sample count for endpoint {{ $labels.endpoint }}"
          description: "Endpoint {{ $labels.endpoint }} has more than 10 invalid samples."
          runbook: "See runbook.md#MetricsAggregatorHighInvalidSamples"
