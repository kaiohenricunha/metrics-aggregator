name: Docker publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    concurrency:
      group: ci-publish-${{ github.ref }}
      cancel-in-progress: true

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
      should_publish: ${{ steps.publish-policy.outputs.should_publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Go version
        id: goversion
        run: |
          echo "version=$(grep '^go ' go.mod | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Determine publish policy for this ref
        id: publish-policy
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Ref ${GITHUB_REF} is not main or semver tag; build will run without push/sign."
          fi

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.publish-policy.outputs.should_publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.version }}

      - name: Sign the published Docker image
        if: ${{ steps.publish-policy.outputs.should_publish == 'true' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  scan-image:
    needs: build
    if: ${{ needs.build.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write      # required for SARIF upload

    steps:
      - name: Scan image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@0.34.1
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
          exit-code: 1           # fail on HIGH / CRITICAL vulns
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
          version: 'v0.68.0'     # pin to avoid broken auto-resolved version
          limit-severities-for-sarif: true

      - name: Check SARIF exists
        id: sarif-check
        if: always()
        run: test -f trivy-results.sarif && echo “exists=true” >> “$GITHUB_OUTPUT” || echo “exists=false” >> “$GITHUB_OUTPUT”

      # upload the report so it appears under “Security › Code scanning”
      - name: Upload Trivy SARIF
        if: ${{ always() && steps.sarif-check.outputs.exists == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
