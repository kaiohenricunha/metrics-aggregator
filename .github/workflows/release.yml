name: GoReleaser

on:
  workflow_run:
    workflows: ["Docker publish"]
    types: [completed]

permissions:
  contents: read

jobs:
  resolve-tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch != 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve semantic tag for triggering run
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const headBranch = context.payload.workflow_run?.head_branch || '';
            const headSha = context.payload.workflow_run?.head_sha || '';
            const semver = /^v\d+\.\d+\.\d+$/;
            const shaRe = /^[0-9a-f]{40}$/i;

            if (!semver.test(headBranch)) {
              core.setFailed(`workflow_run head_branch "${headBranch}" is not a semver tag (vX.Y.Z)`);
              return;
            }
            if (!shaRe.test(headSha)) {
              core.setFailed(`workflow_run head_sha "${headSha}" is not a 40-character SHA`);
              return;
            }

            core.setOutput('tag', headBranch);
            core.setOutput('sha', headSha);

  release:
    needs: resolve-tag
    if: ${{ needs.resolve-tag.result == 'success' && needs.resolve-tag.outputs.tag != '' }}
    runs-on: ubuntu-latest

    concurrency:
      group: goreleaser-${{ needs.resolve-tag.outputs.tag }}
      cancel-in-progress: true

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}

      - name: Verify resolved tag commit matches triggering SHA
        run: |
          set -euo pipefail
          expected_sha="${{ needs.resolve-tag.outputs.sha }}"
          actual_sha="$(git rev-list -n 1 "refs/tags/${{ needs.resolve-tag.outputs.tag }}")"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::Resolved tag does not point to triggering SHA (expected $expected_sha, got $actual_sha)"
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
