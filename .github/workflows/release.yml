name: GoReleaser

on:
  workflow_run:
    workflows: ["Docker publish"]
    types: [completed]

jobs:
  resolve-tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch != 'main' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve semantic tag for triggering commit
        id: resolve
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          triggered_ref="${{ github.event.workflow_run.head_branch }}"
          mapfile -t tags < <(git tag --points-at "$sha" --list 'v*.*.*' | sort -Vr)

          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::No semantic tag found for triggering commit ${sha}"
            exit 1
          fi

          selected_tag="${tags[0]}"
          if [ -n "$triggered_ref" ]; then
            if ! printf '%s\n' "${tags[@]}" | grep -Fxq "$triggered_ref"; then
              echo "::error::Trigger ref ${triggered_ref} is not a semantic tag on ${sha}"
              exit 1
            fi
            selected_tag="$triggered_ref"
          fi

          echo "tag=$selected_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve-tag
    if: ${{ needs.resolve-tag.result == 'success' && needs.resolve-tag.outputs.tag != '' }}
    runs-on: ubuntu-latest

    concurrency:
      group: goreleaser-${{ needs.resolve-tag.outputs.tag }}
      cancel-in-progress: true

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
