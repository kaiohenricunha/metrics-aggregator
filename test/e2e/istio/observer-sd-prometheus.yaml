# Prometheus observer using kubernetes_sd_configs to discover pods by
# prometheus.io/* annotations. In-mesh (has Istio sidecar) so it can
# scrape through mTLS STRICT.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observer-sd-prometheus
  namespace: e2e-metrics-aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observer-sd-prometheus
  template:
    metadata:
      labels:
        app: observer-sd-prometheus
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: prometheus-sd
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/tmp/observer-sd
            - --web.listen-address=:9090
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: observer-sd-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: observer-sd-prometheus
  namespace: e2e-metrics-aggregator
spec:
  selector:
    app: observer-sd-prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      name: http
